name: Build and runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 2
      - name: Check and build
        run: |
          nix flake check --no-build --all-systems
          nix build --no-link --print-out-paths > result.path
      - name: Run without login and verify persistence
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 .github/tests/runtime.py "$(cat result.path)/bin/NapCat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.arch }}
          path: runtime-evidence
